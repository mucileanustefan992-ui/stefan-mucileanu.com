<!DOCTYPE html>
<html lang="ro">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact - Stefan Mucileanu</title>
    <meta name="description" content="Meditații online individuale la matematică pentru clasele 5-8. Copilul rezolvă singur, eu îl ghidez. Ședință de probă disponibilă.">
    <link href="https://fonts.googleapis.com/css2?family=Great+Vibes&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="page-container">
        <header class="site-header">
            <a href="index.html" class="site-name-link">
                <div class="site-name"><span class="name-stefan">Stefan</span> <span class="name-mucileanu">Mucileanu</span></div>
            </a>
            <nav class="main-nav"><ul>
                <li><a href="index.html">Acasă</a></li>
                <li><a href="contact.html" class="cta-button">Contact</a></li>
            </ul></nav>
        </header>

        <main class="main-content-area contact-page-main">
            <div class="form-container hidden-on-load">
                <h2 class="form-title">Programează ședința de probă</h2>
                <p class="form-subtitle">Spune-mi câteva lucruri despre copil și te contactez în cel mai scurt timp.</p>
                <p class="form-subtitle" style="margin-top: 15px; font-weight: 600;">Fără obligații. Dacă nu se potrivește, nu continuăm.</p>
                <form action="https://formspree.io/f/xovrjdnr" method="POST" class="contact-form">
                    <input type="hidden" name="_subject" value="Cerere meditații matematică">
                    <div class="form-group"><label for="name" class="form-label">NUMELE TĂU (PĂRINTE): *</label><input type="text" id="name" name="Name" class="form-input" required></div>
                    <div class="form-group"><label for="phone" class="form-label">NUMĂR TELEFON: *</label><input type="tel" id="phone" name="Phone" class="form-input" required></div>
                    <div class="form-group"><label for="email" class="form-label">EMAIL: *</label><input type="email" id="email" name="Email" class="form-input" required></div>
                    <div class="form-group"><label for="grade" class="form-label">CLASA COPILULUI: *</label>
                        <select id="grade" name="Grade" class="form-select" required>
                            <option value="">Alege clasa</option>
                            <option>a 5-a</option><option>a 6-a</option><option>a 7-a</option><option>a 8-a</option><option>Altă clasă</option>
                        </select></div>
                    <div class="form-group"><label for="problem" class="form-label">CU CE ARE DIFICULTĂȚI:</label><textarea id="problem" name="Problem" class="form-input form-textarea" rows="4"></textarea></div>
                    <button type="submit" class="form-button">Trimite cererea</button>
                    <p class="form-required-note">* CÂMPURI OBLIGATORII</p>
                </form>
            </div>
        </main>

        <!-- AICI LIPEȘTI FOOTER-UL DIN index.html (de la <footer> la </footer>) -->
    </div>
    <script src="script.js" defer></script>
</body>
</html>
